version: '3.8'

services:
  # PostgreSQL база данных
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: code_review_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  # Redis кэш
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - app-network

  # ML сервис - единственный, кто общается с LM Studio
  ml-service:
    build:
      context: ./ml-module
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/code_review_db
      - SECRET_KEY=dev-secret-key-change-in-production
      - LM_STUDIO_URL=http://host.docker.internal:1234  # ML общается с LM Studio
      - LM_STUDIO_ENABLED=true
    volumes:
      - ./ml-module:/app
    networks:
      - app-network
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Доступ к локальному хосту
    restart: unless-stopped

  # Бекенд API - общается только с ML-сервисом
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/code_review_db
      - REDIS_URL=redis://redis:6379
      - ML_SERVICE_URL=http://ml-service:8000
      - SECRET_KEY=dev-secret-key-change-in-production
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - IP=0.0.0.0
      - PYTHONPATH=/app
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    depends_on:
      - postgres
      - redis
      - ml-service
    volumes:
      - ./backend:/app
    networks:
      - app-network
    # УБРАЛИ extra_hosts - backend не нуждается в доступе к локальному хосту
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Фронтенд
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      # УБРАЛИ ML_SERVICE_URL - frontend общается только с backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - app-network
    stdin_open: true
    tty: true
    command: npm start

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
