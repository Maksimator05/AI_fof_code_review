version: '3.8'

services:
  # PostgreSQL база данных - меняем порт
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: code_review_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"  # МЕНЯЕМ НА 5433
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  # Redis кэш
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"  # МЕНЯЕМ НА 6380
    networks:
      - app-network

  # ML сервис - единственный, кто общается с LM Studio
  ml-service:
    build:
      context: ./ml-module
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/code_review_db
      - SECRET_KEY=dev-secret-key-change-in-production
      - LM_STUDIO_URL=http://host.docker.internal:1234  # ML общается с LM Studio
      - LM_STUDIO_ENABLED=true
    volumes:
      - ./ml-module:/app
    networks:
      - app-network
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Доступ к локальному хосту
    restart: unless-stopped

  # Бекенд API - общается только с ML-сервисом
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=sqlite:///./auth.db  # Используем SQLite из вашего кода
      - ML_SERVICE_URL=http://ml-service:8000
      - SECRET_KEY=dev-secret-key-change-in-production
      - IP=0.0.0.0
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://frontend:3000
      - FRONTEND_PORT=3001  # Указываем порт frontend

    depends_on:
      - ml-service
    volumes:
      - ./backend:/app
      - ./backend/auth.db:/app/auth.db  # Для сохранения SQLite базы
    networks:
      - app-network
    command: python -m backend.app.main

  # Фронтенд
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8080  # Для браузера
      - REACT_APP_WS_URL=ws://localhost:8080     # Для вебсокетов
      - CHOKIDAR_USEPOLLING=true  # Для hot reload в Docker
      - PORT=3000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - app-network
    stdin_open: true
    tty: true
    depends_on:
      - backend
    command: npm start

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data: